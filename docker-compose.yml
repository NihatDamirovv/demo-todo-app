version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: demo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data

volumes:
  demo_postgres_data: