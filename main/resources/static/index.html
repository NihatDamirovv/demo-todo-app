<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Demo App - Login & Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">

    <div id="auth-section" class="card p-4 shadow-sm">
        <h3 class="text-center mb-4">Sistemə Giriş</h3>
        <div class="mb-3">
            <label class="form-label">İstifadəçi Adı</label>
            <input type="text" id="username" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Şifrə</label>
            <input type="password" id="password" class="form-control">
        </div>
        <button onclick="login()" class="btn btn-primary w-100 mb-2">Daxil Ol</button>
        <button onclick="register()" class="btn btn-outline-secondary w-100">Qeydiyyatdan Keç</button>
    </div>

    <div id="main-section" class="card p-4 shadow-sm d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>Xoş gəldin, <span id="user-display" class="text-success"></span>!</h4>
            <button onclick="logout()" class="btn btn-sm btn-danger">Çıxış</button>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="todo-input" class="form-control" placeholder="Yeni tapşırıq yaz...">
            <button onclick="addTodo()" class="btn btn-success">Əlavə Et</button>
        </div>

        <ul id="todo-list" class="list-group">
        </ul>
    </div>

</div>

<script>
    let currentUserId = null;
    const API_URL = "http://localhost:8080/api";

    // QEYDİYYAT MEXANİZMİ
    async function register() {
        const user = { username: document.getElementById('username').value, password: document.getElementById('password').value };
        const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(user)
        });
        alert(await res.text());
    }

    // GİRİŞ MEXANİZMİ
    async function login() {
        const user = { username: document.getElementById('username').value, password: document.getElementById('password').value };
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(user)
        });

        if(res.ok) {
            const loggedInUser = await res.json();
            currentUserId = loggedInUser.id;
            document.getElementById('user-display').innerText = loggedInUser.username;

            document.getElementById('auth-section').classList.add('d-none');
            document.getElementById('main-section').classList.remove('d-none');
            loadTodos();
        } else {
            alert("İstifadəçi adı və ya şifrə səhvdir!");
        }
    }

    // TAPŞIRIQLARI BAZADAN ÇƏKMƏK
    async function loadTodos() {
        const res = await fetch(`${API_URL}/todos/user/${currentUserId}`);
        const todos = await res.json();
        const list = document.getElementById('todo-list');
        list.innerHTML = '';

        todos.forEach(todo => {
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${todo.title}
                    <button onclick="deleteTodo(${todo.id})" class="btn btn-danger btn-sm">Sil</button>
                </li>`;
        });
    }

    // YENİ TAPŞIRIQ ƏLAVƏ ETMƏK
    async function addTodo() {
        const title = document.getElementById('todo-input').value;
        if(!title) return;

        await fetch(`${API_URL}/todos`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: title, userId: currentUserId })
        });
        document.getElementById('todo-input').value = '';
        loadTodos();
    }

    // TAPŞIRIĞI SİLMƏK
    async function deleteTodo(id) {
        await fetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
        loadTodos();
    }

    // SİSTEMDƏN ÇIXMAQ
    function logout() {
        currentUserId = null;
        document.getElementById('auth-section').classList.remove('d-none');
        document.getElementById('main-section').classList.add('d-none');
    }
</script>
</body>
</html>
